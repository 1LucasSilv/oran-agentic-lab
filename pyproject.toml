[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oran-agentic-lab"
version = "0.1.0"
description = "Auditoria exploratória de KPMs históricos em Excel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
mcp = ["mcp==2.3.0"]

[project.scripts]
oran-eda = "oran_lab.eda:main"
oran-replay = "oran_lab.detector:main"
oran-loop = "oran_lab.loop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
